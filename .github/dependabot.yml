version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    target-branch: develop
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: numpy
        versions:
          - ">=2.5"

  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    target-branch: develop
    groups:
      dashboard-minor-and-patch:
        update-types:
          - minor
          - patch
