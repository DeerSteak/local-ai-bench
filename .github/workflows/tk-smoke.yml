name: Tk GUI smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  tk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tk and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install Python dependencies
        run: |
          python -m venv bench-env
          bench-env/bin/pip install -r requirements.txt -r tests/requirements.txt
      - name: Run full Python suite with Tk enabled
        run: xvfb-run -a bash tests.sh
