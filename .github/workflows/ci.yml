name: Pull request CI

on:
  pull_request:
    branches:
      - develop
      - "release/**"
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  python-tests:
    name: Python tests (Tk/Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      - name: Install Tk and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install Python dependencies
        run: |
          python -m venv bench-env
          bench-env/bin/pip install -r requirements.txt -r tests/requirements.txt
      - name: Run Python suite with Tk enabled
        run: xvfb-run -a bash tests.sh

  python-types:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m venv bench-env
          bench-env/bin/pip install -r requirements.txt -r tests/requirements.txt
      - name: Run Pyright
        run: npx --yes pyright@1.1.411

  dashboard:
    name: Dashboard tests, lint, and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Run dashboard tests
        run: npm run test:coverage
      - name: Run dashboard lint
        run: npm run lint
      - name: Run dashboard type check
        run: npx tsc --noEmit
      - name: Enforce dashboard any ratchet
        run: node check_any_ratchet.mjs
